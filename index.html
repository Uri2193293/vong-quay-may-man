<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng Quay May Mắn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg1:#050816;--bg2:#1e1b4b;--pri:#22d3ee;--acc:#a855f7;--txt:#e8ecff;--glass:#ffffff12;--line:#ffffff26;
--f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--f);color:var(--txt);background:var(--bg1)}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
#bgimg{position:absolute;inset:0;background:center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 16px}
header::before{content:"";grid-column:1;grid-row:1}
.header-actions{grid-column:3;grid-row:1;display:flex;justify-content:flex-end;gap:8px}
#title{grid-column:2;grid-row:1;width:min(100%,680px);min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:800 clamp(20px,3.6vw,32px) var(--f);text-align:center;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 18px var(--pri);min-width:0}
button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:700 15px var(--f);color:var(--txt);background:var(--glass);backdrop-filter:blur(8px)}
button:hover{border-color:var(--pri);box-shadow:0 0 14px #22d3ee55}
main{max-width:1100px;margin:0 auto;padding:4px 16px 40px;text-align:center}
.tabs{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 16px}
.tabs button{border:0;background:transparent}.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--acc));color:#05060f}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.left{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0;width:100%}
#wbox{position:relative;line-height:0;margin:0 auto;flex-shrink:0;max-width:100%}
#wheel{border-radius:50%;box-shadow:0 0 60px #22d3ee33,0 20px 60px #0009;cursor:pointer}
#ptr{position:absolute;right:-6px;top:50%;width:46px;height:40px;transform:translateY(-50%);background:linear-gradient(90deg,var(--acc),var(--pri));clip-path:polygon(0 50%,100% 0,100% 100%);filter:drop-shadow(0 0 8px var(--pri));pointer-events:none}
#hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;padding:0;font-size:clamp(12px,2.2vw,20px);font-weight:900;letter-spacing:.08em;background:radial-gradient(circle at 35% 30%,#2a3370,#080c26);border:3px solid var(--pri);box-shadow:0 0 22px var(--pri),inset 0 0 18px #22d3ee55}
#go{position:relative;flex-shrink:0;margin:2px 0 8px;font-size:22px;padding:14px 64px;border-radius:50px;letter-spacing:.14em;border:0;background:linear-gradient(135deg,var(--pri),var(--acc));color:#05060f;box-shadow:0 0 28px #22d3ee66}
#go:disabled,#hub:disabled{opacity:.6;cursor:wait}
#side{width:min(680px,100%);text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px)}
#side h3{margin:0 0 10px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--pri)}
#wl{display:flex;flex-wrap:wrap;gap:8px}
.wc{display:flex;align-items:center;gap:10px;background:#ffffff14;border:1px solid var(--pri);border-radius:12px;padding:8px 14px;font-weight:800;font-size:18px;animation:pop .5s;box-shadow:0 0 16px #22d3ee44}
.wc i{font-style:normal;background:linear-gradient(135deg,var(--pri),var(--acc));color:#05060f;border-radius:8px;min-width:26px;text-align:center;padding:1px 6px;font-size:14px}
.empty{opacity:.6;font-size:14px}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#hist{margin-top:14px;max-height:170px;overflow:auto;font-size:13px}
#hist div{padding:4px 0;border-bottom:1px solid var(--line)}
#fsbar{display:none;position:fixed;top:12px;right:14px;gap:8px;z-index:60}
#fx{position:fixed;inset:0;z-index:100;pointer-events:none}
body.fs{overflow:hidden}
body.fs header,body.fs .tabs,body.fs #hist{display:none}
body.fs #fsbar{display:flex}
body.fs main{position:fixed;inset:0;max-width:none;padding:0}
body.fs .stage{height:100%;flex-direction:row;justify-content:center;align-items:center;gap:24px;padding:20px 20px 20px 28px}
body.fs .left{flex:1;min-width:0;width:auto;max-height:100%;gap:16px}
body.fs #side{width:360px;height:calc(100% - 20px);overflow:auto}
body.fs .wc{font-size:26px;width:100%}
@media(max-width:820px){body.fs .stage{flex-direction:column;overflow:auto;justify-content:flex-start}body.fs .left{flex:none;width:100%;max-height:none}body.fs #side{width:100%;height:auto;flex-shrink:0}}
@media(max-width:700px){header{grid-template-columns:1fr;gap:12px}header::before{display:none}#title{grid-column:1;grid-row:1;width:100%;font-size:clamp(18px,5vw,28px)}.header-actions{grid-column:1;grid-row:2;justify-content:center;flex-wrap:wrap}}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#070a1ee6;backdrop-filter:blur(16px);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;transform:translateX(100%);transition:.25s;z-index:70;text-align:left;border-left:1px solid var(--line)}
#panel.open{transform:none}
#panel h4{margin:18px 0 8px;color:var(--pri);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-size:14px}
#panel input[type=number],#panel textarea{background:#ffffff14;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f)}
#panel input[type=number]{width:90px}#panel textarea{width:100%;height:170px;font-size:14px}
#panel input[type=color]{width:46px;height:30px;border:0;background:none;padding:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pre{width:44px;height:30px;border-radius:8px;padding:0}
.hide{display:none}
</style>
</head>
<body>
<div id="bg"><div id="bgimg"></div></div>
<canvas id="fx"></canvas>
<div id="fsbar"><button id="bMute2">🔊</button><button id="bExit">✕</button></div>
<header>
  <input id="title" value="Vòng quay may mắn" aria-label="Tiêu đề">
  <div class="header-actions">
    <button id="bMute" title="Bật/tắt âm thanh">🔊</button>
    <button id="bFull" title="Toàn màn hình">⛶</button>
    <button id="bSet">⚙ Cài đặt</button>
  </div>
</header>
<main>
  <div class="tabs"><button id="tList" class="on">Quay người / danh sách</button><button id="tNum">Quay số may mắn</button></div>
  <div class="stage">
    <div class="left">
      <div id="wbox"><canvas id="wheel"></canvas><div id="ptr"></div><button id="hub">QUAY</button></div>
      <button id="go">QUAY</button>
    </div>
    <div id="side">
      <h3>🏆 Người trúng giải</h3>
      <div id="wl"><span class="empty">Chưa có kết quả</span></div>
      <div id="hist"><div id="hl" class="empty">Lịch sử các lần quay sẽ hiện ở đây</div></div>
    </div>
  </div>
</main>

<aside id="panel">
  <div class="row" style="justify-content:space-between"><b style="font-size:18px">Cài đặt</b><button id="bClose">✕</button></div>
  <div id="secList">
    <h4>Danh sách (mỗi dòng 1 tên)</h4>
    <textarea id="names">Nguyễn Văn An
Trần Thị Bình
Lê Hoàng Cường
Phạm Thị Dung
Hoàng Minh Đức
Vũ Thị Hà
Đặng Quốc Huy
Bùi Thị Lan</textarea>
    <label>Nhập từ Excel/CSV (cột 1)<input type="file" id="xl" accept=".xlsx,.xls,.csv" style="max-width:150px"></label>
    <label>Dòng đầu là tiêu đề<input type="checkbox" id="hdr" checked></label>
    <span id="cnt" style="font-size:13px;opacity:.8"></span>
  </div>
  <div id="secNum" class="hide">
    <h4>Dải số may mắn</h4>
    <label>Từ số<input type="number" id="nmin" value="1"></label>
    <label>Đến số<input type="number" id="nmax" value="100"></label>
  </div>
  <h4>Quy tắc quay</h4>
  <label>Số lượng quay cùng lúc<input type="number" id="qty" value="3" min="1" max="50"></label>
  <label>Thời gian mỗi lần quay (giây)<input type="number" id="dur" value="5" min="1" max="30"></label>
  <label>Không trùng người/số đã trúng<input type="checkbox" id="uniq" checked></label>
  <button id="bReset" style="width:100%;margin-top:6px">↺ Làm mới danh sách đã trúng</button>
  <h4>Màu giao diện</h4>
  <label>Nền (màu 1)<input type="color" id="c1" value="#050816"></label>
  <label>Nền (màu 2)<input type="color" id="c2" value="#1e1b4b"></label>
  <label>Màu nhấn 1<input type="color" id="cp" value="#22d3ee"></label>
  <label>Màu nhấn 2<input type="color" id="ca" value="#a855f7"></label>
  <label>Màu chữ<input type="color" id="ct" value="#e8ecff"></label>
  <h4>Màu vòng quay (xen kẽ)</h4>
  <div class="row"><input type="color" id="w1" value="#06b6d4"><input type="color" id="w2" value="#6366f1"><input type="color" id="w3" value="#a855f7"><input type="color" id="w4" value="#ec4899"></div>
  <h4>Chủ đề có sẵn</h4>
  <div class="row" id="pres"></div>
  <h4>Ảnh nền</h4>
  <label>Tải ảnh từ máy tính<input type="file" id="bgf" accept="image/*" style="max-width:150px"></label>
  <button id="bgx" style="width:100%">Xóa ảnh nền</button>
</aside>

<script>
const $=id=>document.getElementById(id);
let mode="list",busy=false,won=new Set(),round=0,segs=[],rot=0,muted=false,AC=null;
const cv=$("wheel"),ctx=cv.getContext("2d"),T=Math.PI*2;
const presets=[["#050816","#1e1b4b","#22d3ee","#a855f7","#06b6d4","#6366f1","#a855f7","#ec4899"],["#1a0a14","#7f1d1d","#fbbf24","#fb7185","#f43f5e","#f97316","#eab308","#be185d"],["#021a14","#064e3b","#34d399","#22d3ee","#10b981","#14b8a6","#0ea5e9","#84cc16"],["#0b0b0f","#27272a","#facc15","#f59e0b","#b45309","#ca8a04","#78350f","#d97706"]];
presets.forEach(p=>{const b=document.createElement("button");b.className="pre";b.style.background=`linear-gradient(135deg,${p[0]},${p[1]} 50%,${p[2]})`;
 b.onclick=()=>{["c1","c2","cp","ca","w1","w2","w3","w4"].forEach((id,i)=>$(id).value=p[i]);theme()};$("pres").appendChild(b)});
function theme(){const s=document.documentElement.style;[["--bg1","c1"],["--bg2","c2"],["--pri","cp"],["--acc","ca"],["--txt","ct"]].forEach(([v,i])=>s.setProperty(v,$(i).value));draw()}
["c1","c2","cp","ca","ct","w1","w2","w3","w4"].forEach(i=>$(i).oninput=theme);
$("bgf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onerror=()=>alert("Không đọc được ảnh");
 r.onload=()=>{const im=new Image();im.onerror=()=>alert("File ảnh không hợp lệ");
  im.onload=()=>{const s=Math.min(1,1920/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);$("bgimg").style.backgroundImage=`url(${c.toDataURL("image/jpeg",.85)})`};im.src=r.result};
 r.readAsDataURL(f);e.target.value=""};
$("bgx").onclick=()=>$("bgimg").style.backgroundImage="none";
$("bSet").onclick=()=>$("panel").classList.add("open");
$("bClose").onclick=()=>$("panel").classList.remove("open");
function setMute(){$("bMute").textContent=$("bMute2").textContent=muted?"🔇":"🔊"}
$("bMute").onclick=$("bMute2").onclick=()=>{muted=!muted;setMute()};
function enterFs(){document.body.classList.add("fs");$("panel").classList.remove("open");try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}setTimeout(size,150)}
function exitFs(){document.body.classList.remove("fs");try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}setTimeout(size,150)}
$("bFull").onclick=enterFs;$("bExit").onclick=exitFs;
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("fs"))exitFs();else size()});
addEventListener("keydown",e=>{if(e.key=="Escape"&&document.body.classList.contains("fs"))exitFs()});

/* âm thanh */
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}
let lastTick=0;
function tick(){if(muted||!AC)return;const n=performance.now();if(n-lastTick<30)return;lastTick=n;tone(700+Math.random()*250,AC.currentTime,.05,"triangle",.1)}
function fanfare(){if(muted||!AC)return;const t=AC.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.55,"sine",.16));tone(1568,t+.5,.8,"triangle",.1)}

/* pháo hoa */
const fx=$("fx"),fc=fx.getContext("2d");let P=[],fxOn=false;
function fxFit(){fx.width=innerWidth;fx.height=innerHeight}fxFit();addEventListener("resize",fxFit);
function burst(x,y){const h=rnd(0,360);for(let i=0;i<80;i++){const a=Math.random()*T,s=1.5+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70+Math.random()*30,m:100,c:`hsl(${h+rnd(-25,25)},95%,62%)`,g:.07,r:2.2})}}
function confetti(){for(let i=0;i<70;i++)P.push({x:Math.random()*fx.width,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:220,m:220,c:`hsl(${rnd(0,360)},90%,60%)`,g:.02,r:3.5,sq:1})}
function fireworks(n){for(let k=0;k<n;k++)setTimeout(()=>burst(fx.width*(.15+Math.random()*.7),fx.height*(.12+Math.random()*.4)),k*260);if(n>2)confetti();if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);
 P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.992;p.l--;fc.globalAlpha=Math.min(1,p.l/40);fc.fillStyle=p.c;
  if(p.sq)fc.fillRect(p.x,p.y,p.r*2,p.r);else{fc.beginPath();fc.arc(p.x,p.y,p.r,0,T);fc.fill()}});
 fc.globalAlpha=1;if(P.length)requestAnimationFrame(fxLoop);else fxOn=false}

/* dữ liệu */
const getNames=()=>$("names").value.split("\n").map(s=>s.trim()).filter(Boolean);
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function basePool(){const u=$("uniq").checked;let all;
 if(mode=="list")all=getNames();else{const x=+$("nmin").value||0,y=+$("nmax").value||0,a=Math.min(x,y),b=Math.max(x,y);all=[];if(b-a<=200000)for(let i=a;i<=b;i++)all.push(String(i))}
 return u?all.filter(x=>!won.has(x)):all}
function preview(){const p=basePool();segs=p.length>60?shuffle(p).slice(0,24):p;$("cnt").textContent=`Có ${getNames().length} tên · đã trúng ${won.size}`;draw()}

/* vòng quay */
function mix(h,t){const n=parseInt(h.slice(1),16);return`rgb(${(n>>16)*t|0},${((n>>8)&255)*t|0},${(n&255)*t|0})`}
function lum(h){const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*((n>>8)&255)+.114*(n&255)}
function size(){const fs=document.body.classList.contains("fs");
 let s=fs?Math.min(innerHeight-150,innerWidth<=820?innerWidth-40:innerWidth-430,820):Math.min(innerWidth-32,540);s=Math.max(240,s);
 const d=devicePixelRatio||1;cv.style.width=cv.style.height=s+"px";cv.width=cv.height=Math.round(s*d);draw()}
function draw(){const d=cv.width,R=d/2,k=d/560,n=segs.length,Rs=R-30*k;ctx.clearRect(0,0,d,d);
 const pri=$("cp").value,acc=$("ca").value;
 let g=ctx.createRadialGradient(R,R,Rs,R,R,R);g.addColorStop(0,"#10163a");g.addColorStop(1,"#03040d");
 ctx.beginPath();ctx.arc(R,R,R,0,T);ctx.fillStyle=g;ctx.fill();
 ctx.lineWidth=3*k;ctx.strokeStyle=pri;ctx.shadowColor=pri;ctx.shadowBlur=14*k;ctx.beginPath();ctx.arc(R,R,R-2*k,0,T);ctx.stroke();ctx.shadowBlur=0;
 for(let i=0;i<40;i++){const a=i/40*T;ctx.beginPath();ctx.arc(R+Math.cos(a)*(R-15*k),R+Math.sin(a)*(R-15*k),3.2*k,0,T);ctx.fillStyle=i%2?"#ffffff55":acc;ctx.fill()}
 if(!n){ctx.beginPath();ctx.arc(R,R,Rs,0,T);ctx.fillStyle="#ffffff14";ctx.fill();return}
 const a=T/n,cols=["w1","w2","w3","w4"].map(i=>$(i).value);
 for(let i=0;i<n;i++){let c=cols[i%4];if(n%4==1&&i==n-1)c=cols[1];
  const gr=ctx.createRadialGradient(R,R,0,R,R,Rs);gr.addColorStop(0,mix(c,.35));gr.addColorStop(1,c);
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,Rs,rot+i*a,rot+(i+1)*a);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.lineWidth=1.2*k;ctx.strokeStyle="#ffffff40";ctx.stroke();
  // Giữ toàn bộ chữ nằm ngoài nút QUAY ở tâm (nút rộng 19% đường kính).
  const outer=Rs-20*k;
  const hubSafeRadius=R*.19+18*k; // bán kính nút + khoảng cách an toàn
  const availableWidth=Math.max(0,outer-hubSafeRadius);
  const baseFont=Math.min(Rs*.1,a*Rs*.5);
  if(baseFont>6*k&&availableWidth>12*k){
   ctx.save();ctx.translate(R,R);ctx.rotate(rot+(i+.5)*a);
   ctx.textAlign="right";ctx.textBaseline="middle";
   ctx.fillStyle=lum(c)>170?"#0a0a14":"#fff";
   let fontSize=baseFont;
   const setFont=()=>{ctx.font=`800 ${fontSize}px "Be Vietnam Pro",system-ui,sans-serif`};
   setFont();
   let t=String(segs[i]);
   // Thu nhỏ font trước, chỉ rút gọn tên khi vẫn không đủ khoảng trống.
   while(ctx.measureText(t).width>availableWidth&&fontSize>11*k){
    fontSize=Math.max(11*k,fontSize-1*k);setFont();
   }
   if(ctx.measureText(t).width>availableWidth){
    while(t.length>1&&ctx.measureText(t+"…").width>availableWidth)t=t.slice(0,-1);
    t=t+"…";
   }
   ctx.fillText(t,outer,0,availableWidth);
   ctx.restore();
  }}
 ctx.beginPath();ctx.arc(R,R,Rs,0,T);ctx.lineWidth=2*k;ctx.strokeStyle="#ffffff66";ctx.stroke()}
function spinTo(idx,ms){return new Promise(res=>{const n=segs.length,a=T/n,target=-(idx+.5+(Math.random()-.5)*.7)*a;
 const delta=(((target-rot)%T)+T)%T+T*6,r0=rot,t0=performance.now();let last=-1;
 (function f(t){const p=Math.min(1,(t-t0)/ms);rot=r0+delta*(1-Math.pow(1-p,4));
  const cur=Math.floor((((-rot)%T)+T)%T/a)%n;if(cur!==last){last=cur;tick()}
  draw();if(p<1)requestAnimationFrame(f);else{rot%=T;res()}})(t0)})}
async function run(){
 if(busy)return;ac();
 const qty=Math.max(1,+$("qty").value||1),dur=Math.max(1,+$("dur").value||5)*1000,u=$("uniq").checked;
 let avail=basePool();
 if(!avail.length){alert("Không còn gì để quay. Hãy nhấn “Làm mới danh sách đã trúng” hoặc thêm dữ liệu.");return}
 const n=Math.min(qty,avail.length),ms=n==1?dur:Math.max(1800,dur*.6),got=[];
 busy=true;$("hub").disabled=$("go").disabled=true;$("wl").innerHTML="";
 for(let k=0;k<n;k++){
  const w=avail[rnd(0,avail.length-1)];
  segs=avail.length>60?shuffle(shuffle(avail.filter(x=>x!==w)).slice(0,29).concat(w)):avail.slice();
  await spinTo(segs.indexOf(w),ms);
  got.push(w);avail=avail.filter(x=>x!==w);if(u)won.add(w);
  const c=document.createElement("div");c.className="wc";c.innerHTML=`<i>${k+1}</i>${esc(w)}`;$("wl").appendChild(c);c.scrollIntoView({block:"nearest"});
  fanfare();fireworks(k==n-1?6:2);
  if(k<n-1)await sleep(1100)}
 round++;const hl=$("hl");if(round==1){hl.innerHTML="";hl.className=""}
 const h=document.createElement("div");h.innerHTML=`<b>Lần ${round}:</b> ${got.map(esc).join(", ")}`;hl.prepend(h);
 busy=false;$("hub").disabled=$("go").disabled=false;await sleep(2500);if(!busy)preview()}
$("hub").onclick=run;$("go").onclick=run;cv.onclick=run;
function setMode(m){if(busy)return;mode=m;$("tList").classList.toggle("on",m=="list");$("tNum").classList.toggle("on",m=="num");
 $("secList").classList.toggle("hide",m!="list");$("secNum").classList.toggle("hide",m!="num");preview()}
$("tList").onclick=()=>setMode("list");$("tNum").onclick=()=>setMode("num");
$("names").oninput=()=>{if(!busy)preview()};["nmin","nmax","uniq"].forEach(i=>$(i).onchange=()=>{if(!busy)preview()});
$("bReset").onclick=()=>{won.clear();if(!busy)preview()};
$("xl").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
 let col=rows.map(r=>String(r[0]??"").trim()).filter(Boolean);if($("hdr").checked)col=col.slice(1);
 $("names").value=col.join("\n");won.clear();preview();alert(`Đã nhập ${col.length} tên từ file`)}
 catch(err){alert("Không đọc được file Excel")}e.target.value=""};
addEventListener("resize",size);size();preview();
try{document.fonts.load('800 20px "Be Vietnam Pro"').then(draw)}catch(e){}
</script>
